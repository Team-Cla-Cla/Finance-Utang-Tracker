name: Test

on:
  push:
    branches:
      - main
      - development
  pull_request:
    branches:
      - main
      - development

permissions:
  contents: read

jobs:
  test:
    name: JavaScript syntax and asset checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Check JavaScript syntax
        run: |
          node --check shared/domain.js
          node --check shared/application.js
          node --check tests/domain.test.js
          node --check tests/client.test.js
          node --check docs/shared/domain.js
          node --check docs/shared/application.js
          node --check docs/client/helpers.js
          node --check docs/client/state.js
          node --check docs/client/status.js
          node --check docs/client/canvas-orbs.js
          node --check docs/client/canvas-gol.js
          node --check docs/client/canvas-telemetry.js
          node --check docs/client/canvas-background.js
          node --check docs/client/analytics.js
          node --check docs/client/calendar.js
          node --check docs/client/transactions.js
          node --check docs/client/debts.js
          node --check docs/client/stashes.js
          node --check docs/client/presets.js
          node --check docs/client/sync.js
          node --check docs/client/event-listeners.js
          node --check docs/client/form-utang.js
          node --check docs/client/ui-render.js
          node --check docs/client/edit-modal.js
          node --check docs/client/audit.js
          node --check docs/client/bootstrap.js
          node --check extension/shared/domain.js
          node --check extension/shared/application.js
          node --check extension/client/helpers.js
          node --check extension/client/state.js
          node --check extension/client/status.js
          node --check extension/client/canvas-orbs.js
          node --check extension/client/canvas-gol.js
          node --check extension/client/canvas-telemetry.js
          node --check extension/client/canvas-background.js
          node --check extension/client/analytics.js
          node --check extension/client/calendar.js
          node --check extension/client/transactions.js
          node --check extension/client/debts.js
          node --check extension/client/stashes.js
          node --check extension/client/presets.js
          node --check extension/client/sync.js
          node --check extension/client/event-listeners.js
          node --check extension/client/form-utang.js
          node --check extension/client/ui-render.js
          node --check extension/client/edit-modal.js
          node --check extension/client/audit.js
          node --check extension/client/bootstrap.js
          node --check docs/popup.js
          node --check docs/google_sync.js
          node --check docs/sw.js
          node --check extension/popup.js
          node --check extension/google_sync.js
          node --check extension/background.js

      - name: Check required GUI assets
        run: |
          test -f docs/index.html
          test -f docs/manifest.webmanifest
          test -f docs/shared/domain.js
          test -f docs/shared/application.js
          test -f docs/styles/app.css
          test -f docs/client/helpers.js
          test -f docs/client/state.js
          test -f docs/client/status.js
          test -f docs/client/canvas-orbs.js
          test -f docs/client/canvas-gol.js
          test -f docs/client/canvas-telemetry.js
          test -f docs/client/canvas-background.js
          test -f docs/client/analytics.js
          test -f docs/client/calendar.js
          test -f docs/client/transactions.js
          test -f docs/client/debts.js
          test -f docs/client/stashes.js
          test -f docs/client/presets.js
          test -f docs/client/sync.js
          test -f docs/client/event-listeners.js
          test -f docs/client/form-utang.js
          test -f docs/client/ui-render.js
          test -f docs/client/edit-modal.js
          test -f docs/client/audit.js
          test -f docs/client/bootstrap.js
          test -f extension/popup.html
          test -f extension/manifest.json
          test -f extension/shared/domain.js
          test -f extension/shared/application.js
          test -f extension/styles/app.css
          test -f extension/client/helpers.js
          test -f extension/client/state.js
          test -f extension/client/status.js
          test -f extension/client/canvas-orbs.js
          test -f extension/client/canvas-gol.js
          test -f extension/client/canvas-telemetry.js
          test -f extension/client/canvas-background.js
          test -f extension/client/analytics.js
          test -f extension/client/calendar.js
          test -f extension/client/transactions.js
          test -f extension/client/debts.js
          test -f extension/client/stashes.js
          test -f extension/client/presets.js
          test -f extension/client/sync.js
          test -f extension/client/event-listeners.js
          test -f extension/client/form-utang.js
          test -f extension/client/ui-render.js
          test -f extension/client/edit-modal.js
          test -f extension/client/audit.js
          test -f extension/client/bootstrap.js

      - name: Check synchronized client copies
        run: |
          cmp --silent shared/domain.js docs/shared/domain.js
          cmp --silent shared/domain.js extension/shared/domain.js
          cmp --silent shared/application.js docs/shared/application.js
          cmp --silent shared/application.js extension/shared/application.js
          cmp --silent docs/styles/app.css extension/styles/app.css
          cmp --silent docs/client/helpers.js extension/client/helpers.js
          cmp --silent docs/client/state.js extension/client/state.js
          cmp --silent docs/client/status.js extension/client/status.js
          cmp --silent docs/client/canvas-orbs.js extension/client/canvas-orbs.js
          cmp --silent docs/client/canvas-gol.js extension/client/canvas-gol.js
          cmp --silent docs/client/canvas-telemetry.js extension/client/canvas-telemetry.js
          cmp --silent docs/client/canvas-background.js extension/client/canvas-background.js
          cmp --silent docs/client/analytics.js extension/client/analytics.js
          cmp --silent docs/client/calendar.js extension/client/calendar.js
          cmp --silent docs/client/transactions.js extension/client/transactions.js
          cmp --silent docs/client/debts.js extension/client/debts.js
          cmp --silent docs/client/stashes.js extension/client/stashes.js
          cmp --silent docs/client/presets.js extension/client/presets.js
          cmp --silent docs/client/sync.js extension/client/sync.js
          cmp --silent docs/client/event-listeners.js extension/client/event-listeners.js
          cmp --silent docs/client/form-utang.js extension/client/form-utang.js
          cmp --silent docs/client/ui-render.js extension/client/ui-render.js
          cmp --silent docs/client/edit-modal.js extension/client/edit-modal.js
          cmp --silent docs/client/audit.js extension/client/audit.js
          cmp --silent docs/client/bootstrap.js extension/client/bootstrap.js
          cmp --silent docs/index.html extension/popup.html
          cmp --silent docs/popup.js extension/popup.js

      - name: Run domain tests
        run: node tests/domain.test.js

      - name: Run client architecture tests
        run: node tests/client.test.js
