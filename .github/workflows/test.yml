name: Test

on:
  push:
    branches:
      - main
      - development
  pull_request:
    branches:
      - main
      - development

permissions:
  contents: read

jobs:
  test:
    name: JavaScript syntax and asset checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Check JavaScript syntax
        run: |
          node --check docs/popup.js
          node --check docs/google_sync.js
          node --check docs/sw.js
          node --check extension/popup.js
          node --check extension/google_sync.js
          node --check extension/background.js

      - name: Check required GUI assets
        run: |
          test -f docs/index.html
          test -f docs/manifest.webmanifest
          test -f extension/popup.html
          test -f extension/manifest.json
